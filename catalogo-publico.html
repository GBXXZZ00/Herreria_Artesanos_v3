<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Herrería Artesanos · Catálogo</title>
<link rel="stylesheet" href="assets/css/base.css?v=4">
<style>
  .page{padding-bottom:40px;max-width:900px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 18px 0}
  @media (min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 8px 10px;box-shadow:var(--shadow-sm)}
  .card-photo{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
  .card-photo img{width:100%;height:100%;object-fit:cover}
  .card-badge{position:absolute;top:8px;left:8px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,0.94);font-size:11px;font-weight:800}
  .card-name{font-size:15px;font-weight:700;line-height:1.25;margin:10px 4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-price{font-size:16.5px;font-weight:800;color:var(--accent);margin:6px 4px 10px}
  .wa-btn{margin-top:auto;height:42px;border-radius:12px;background:var(--ink);color:#fff;text-decoration:none;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform 140ms var(--ease-out)}
  .wa-btn:active{transform:scale(0.97)}
  .state{grid-column:1/-1;text-align:center;padding:48px 24px;color:var(--ink-soft)}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo-mark">HA</div>
  <div class="topbar-text"><div class="topbar-title" style="font-size:19px">Herrería Artesanos</div></div>
</header>
<main class="page">
  <div class="chips" id="chips"></div>
  <label class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="buscador" placeholder="Buscar puertas, ventanas" autocomplete="off" aria-label="Buscar">
  </label>
  <section class="grid" id="grid"><div class="state">Cargando catálogo</div></section>
</main>

<script src="assets/vendor/supabase.js?v=4"></script>
<script src="assets/js/supabase-client.js?v=4"></script>
<script>
(function(){
  'use strict';
  const db = window.db;
  const NUMERO_WHATSAPP = ''; // Pendiente: número del negocio, ej. '584121234567'
  let modelos = [];
  let filtro = 'Todos';
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const fmt = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });

  function foto(m){
    const f = m.fotos || {};
    return f.Blanco || f.Negro || f.Principal || Object.values(f).find(Boolean) || null;
  }

  function pintarChips(){
    const tipos = ['Todos', ...new Set(modelos.map(m => m.tipo))];
    $('chips').innerHTML = tipos.map(t => `<button class="chip ${t === filtro ? 'active' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
  }

  function pintar(){
    const q = $('buscador').value.trim().toLowerCase();
    const lista = modelos.filter(m => (filtro === 'Todos' || m.tipo === filtro) && (!q || (m.nombre || '').toLowerCase().includes(q)));
    if(!lista.length){ $('grid').innerHTML = '<div class="state">Todavía no hay nada que mostrar aquí.</div>'; return; }
    $('grid').innerHTML = lista.map(m => {
      const f = foto(m);
      const msg = encodeURIComponent(`Hola, quiero información sobre: ${m.nombre}`);
      const link = NUMERO_WHATSAPP ? `https://wa.me/${NUMERO_WHATSAPP}?text=${msg}` : `https://wa.me/?text=${msg}`;
      return `
        <article class="card">
          <div class="card-photo">
            ${f ? `<img src="${esc(f)}" alt="${esc(m.nombre)}" loading="lazy">` : `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>`}
            ${m.badge ? `<span class="card-badge">${esc(m.badge)}</span>` : ''}
          </div>
          <div class="card-name">${esc(m.nombre)}</div>
          <div class="card-price">Desde $${fmt.format(Number(m.precio_base) || 0)}</div>
          <a class="wa-btn" href="${link}" target="_blank" rel="noopener">Pedir por WhatsApp</a>
        </article>`;
    }).join('');
  }

  async function cargar(){
    try{
      if(!db) throw new Error('sin conexión');
      const { data, error } = await db.from('catalogo').select('*').order('id', { ascending:false });
      if(error) throw error;
      modelos = data || [];
      pintarChips();
      pintar();
    } catch(err){
      $('grid').innerHTML = '<div class="state">No se pudo cargar el catálogo. Revisa tu conexión e intenta de nuevo.</div>';
    }
  }

  $('chips').addEventListener('click', (e)=>{
    const b = e.target.closest('.chip');
    if(!b) return;
    filtro = b.dataset.t;
    pintarChips();
    pintar();
  });
  $('buscador').addEventListener('input', pintar);
  cargar();
})();
</script>
</body>
</html>
