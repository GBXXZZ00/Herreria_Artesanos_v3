<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo — Herrería Artesanos</title>
<link rel="stylesheet" href="assets/css/base.css?v=3">
<style>
  .content{padding:16px 18px calc(var(--nav-h) + 90px);max-width:640px;margin:0 auto}
  .error-state{text-align:center;padding:40px 20px;color:var(--ink-soft)}
  .error-state button{margin-top:12px;background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:600}
  .grid-modelos{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .modelo-row{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;
    display:flex;align-items:center;gap:12px;text-align:left;border-width:1px;width:100%;
  }
  .modelo-row:active{transform:scale(0.99)}
  .thumb{
    width:52px;height:52px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#EFE8D8,#E4DCCB);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .thumb img{width:100%;height:100%;object-fit:cover}
  .modelo-info{flex:1;min-width:0}
  .modelo-nombre{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .modelo-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .warn-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft)}
  .fotos-tipo{display:flex;gap:10px;flex-wrap:wrap}
  .foto-slot{
    width:76px;height:76px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0;
  }
  .foto-slot img{width:100%;height:100%;object-fit:cover}
  .foto-slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .foto-slot-label{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--ink-soft);background:rgba(255,255,255,0.85)}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo-mark"><span>HA</span></div>
  <div class="topbar-title">Catálogo</div>
  <div style="font-size:12.5px;color:var(--ink-soft)" id="totalModelos">…</div>
</div>

<div class="content">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" id="buscador" placeholder="Buscar modelo...">
  </div>

  <div class="chips" id="chips" style="margin-top:12px"></div>

  <div class="grid-modelos" id="listaModelos">
    <div class="empty-state">Cargando catálogo...</div>
  </div>
</div>

<button class="fab" id="btnNuevo" aria-label="Nuevo modelo">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="bottom-nav-wrap">
<nav class="bottom-nav">
  <button class="nav-item disabled" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-6 9 6v11a1 1 0 01-1 1H4a1 1 0 01-1-1z"/></svg>
    <span>Ventas</span>
  </button>
  <button class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v6"/></svg>
    <span>Catálogo</span>
  </button>
  <button class="nav-item disabled" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 11-5.4 5.4L4 17v3h3l5.3-5.3"/></svg>
    <span>Producción</span>
  </button>
  <button class="nav-item disabled" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 15h4"/></svg>
    <span>Nómina</span>
  </button>
</nav>
</div>

<!-- HOJA: nuevo / editar modelo -->
<div class="sheet-scrim" id="scrim"></div>
<div class="sheet" id="sheetModelo">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2 class="serif" style="margin:0;font-size:18px" id="sheetTitulo">Nuevo modelo</h2>
    <button id="btnCerrarSheet" style="background:none;border:none;padding:6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#211D18" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label>Nombre del modelo</label>
      <input type="text" id="fNombre" placeholder="Ej: Puerta Toscana Doble Panel">
    </div>

    <div class="field">
      <label>Tipo de producto</label>
      <div class="pill-group" id="pillsTipo"></div>
    </div>

    <div id="camposEspecificos"></div>

    <div class="field">
      <label>Precio base (USD)</label>
      <input type="number" id="fPrecio" placeholder="0" min="0" step="0.01">
    </div>

    <div class="field">
      <label>Foto (por color, si aplica)</label>
      <div class="fotos-tipo" id="fotosTipo"></div>
    </div>

    <div class="field">
      <label>Insignia (opcional)</label>
      <input type="text" id="fBadge" placeholder="Ej: Nuevo, Más vendido">
    </div>

    <div class="field">
      <label>Descripción para el cliente (Catálogo Público)</label>
      <textarea id="fDescripcion" placeholder="Frase corta y sencilla, sin términos técnicos"></textarea>
    </div>

    <button class="btn-primary" id="btnGuardarModelo">Guardar modelo</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/supabase-client.js?v=3"></script>
<script src="assets/js/img-compress.js?v=3"></script>
<script>
const TIPOS = ['Puerta','Ventana','Portón','Combo','Puerta Multilock','Puerta de Madera'];
const CATS_CHIP = ['Todos', ...TIPOS];

let modelos = [];
let tipoSeleccionado = TIPOS[0];
let categoriaActiva = 'Todos';
let fotosPendientes = {}; // color -> {blob, previewUrl}
let editandoId = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------- Cargar y pintar lista ----------
async function cargarModelos(){
  const cont = document.getElementById('listaModelos');
  const { data, error } = await supabase.from('catalogo').select('*').order('id', { ascending:false });
  if(error){
    cont.innerHTML = `
      <div class="error-state">
        No se pudo cargar el catálogo.<br><span style="font-size:12px">${error.message}</span>
        <br><button id="btnReintentar">Reintentar</button>
      </div>`;
    document.getElementById('btnReintentar').onclick = cargarModelos;
    toast('Error cargando catálogo');
    return;
  }
  modelos = data || [];
  document.getElementById('totalModelos').textContent = modelos.length + ' modelos';
  pintarChips();
  pintarLista();
}

function pintarChips(){
  const cont = document.getElementById('chips');
  cont.innerHTML = CATS_CHIP.map(c =>
    `<button class="chip ${c===categoriaActiva?'active':''}" data-cat="${c}">${c}</button>`
  ).join('');
  cont.querySelectorAll('.chip').forEach(el=>{
    el.onclick = ()=>{ categoriaActiva = el.dataset.cat; pintarChips(); pintarLista(); };
  });
}

function pintarLista(){
  const q = document.getElementById('buscador').value.trim().toLowerCase();
  const filtrados = modelos.filter(m=>{
    const pasaCat = categoriaActiva==='Todos' || m.tipo===categoriaActiva;
    const pasaBusq = !q || m.nombre.toLowerCase().includes(q);
    return pasaCat && pasaBusq;
  });
  const cont = document.getElementById('listaModelos');
  if(filtrados.length===0){
    cont.innerHTML = '<div class="empty-state">No hay modelos aquí todavía.<br>Toca el botón + para agregar el primero.</div>';
    return;
  }
  cont.innerHTML = filtrados.map(m=>{
    const primeraFoto = m.fotos && Object.values(m.fotos)[0];
    const sinCategoria = !m.categoria_pago_id;
    return `
      <button class="modelo-row" data-id="${m.id}">
        <div class="thumb">${primeraFoto ? `<img src="${primeraFoto}">` : ''}</div>
        <div class="modelo-info">
          <div class="modelo-nombre">${m.nombre}</div>
          <div class="modelo-meta">${m.tipo} · $${Number(m.precio_base).toFixed(2)}</div>
        </div>
        ${sinCategoria ? '<div class="warn-dot" title="Falta categoría de pago"></div>' : ''}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B8AF9C" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>`;
  }).join('');
  cont.querySelectorAll('.modelo-row').forEach(el=>{
    el.onclick = ()=> abrirSheet(Number(el.dataset.id));
  });
}

document.getElementById('buscador').oninput = pintarLista;

// ---------- Campos dinámicos por tipo ----------
function coloresPorTipo(tipo){
  if(tipo === 'Puerta de Madera') return ['Natural','Barnizada'];
  return ['Blanco','Negro'];
}

function renderCamposEspecificos(tipo, valoresPrevios = {}){
  const cont = document.getElementById('camposEspecificos');
  const v = valoresPrevios;
  let html = `
    <div class="field">
      <label>Medidas típicas (m)</label>
      <div style="display:flex;gap:10px">
        <input type="number" id="specAlto" placeholder="Alto" step="0.01" value="${v.alto||''}" style="flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px">
        <input type="number" id="specAncho" placeholder="Ancho" step="0.01" value="${v.ancho||''}" style="flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px">
      </div>
    </div>`;

  if(tipo === 'Combo'){
    html += pillFieldHtml('specVariante', 'Variante del combo', ['Sin protección en puerta','Con protección en puerta'], v.variante || 'Con protección en puerta');
  } else if(tipo === 'Puerta de Madera'){
    html += pillFieldHtml('specMadera', 'Tipo de madera', ['Pino','Cedro','Roble'], v.tipo_madera || 'Pino');
    html += toggleFieldHtml('specBarniz', 'Barniz incluido de fábrica', v.barniz !== false);
  } else {
    html += pillFieldHtml('specVidrio', 'Vidrio o Farquilla', ['Vidrio','Farquilla'], v.vidrio_o_farquilla || 'Vidrio');
    if(tipo !== 'Portón'){
      html += toggleFieldHtml('specManillon', 'Manillón', !!v.manillon);
      html += toggleFieldHtml('specMarco', 'Marco decorativo', !!v.marco_decorativo);
      html += toggleFieldHtml('specProteccion', 'Protección', !!v.proteccion);
    } else {
      html += toggleFieldHtml('specManillon', 'Manillón', !!v.manillon);
    }
  }
  cont.innerHTML = html;
  cont.querySelectorAll('.pill-group[data-field]').forEach(activarPills);
  cont.querySelectorAll('.toggle').forEach(activarToggle);
}

function pillFieldHtml(id, label, opciones, seleccionado){
  return `
    <div class="field">
      <label>${label}</label>
      <div class="pill-group" id="${id}" data-field="${id}">
        ${opciones.map(o=>`<button type="button" class="pill ${o===seleccionado?'selected':''}" data-val="${o}">${o}</button>`).join('')}
      </div>
    </div>`;
}
function toggleFieldHtml(id, label, activo){
  return `
    <div class="toggle-row">
      <span style="font-size:14px">${label}</span>
      <button type="button" class="toggle ${activo?'on':''}" id="${id}"></button>
    </div>`;
}
function activarPills(grupo){
  grupo.querySelectorAll('.pill').forEach(p=>{
    p.onclick = ()=>{
      grupo.querySelectorAll('.pill').forEach(x=>x.classList.remove('selected'));
      p.classList.add('selected');
    };
  });
}
function activarToggle(btn){
  btn.onclick = ()=> btn.classList.toggle('on');
}
function valorPills(id){
  const grupo = document.getElementById(id);
  const sel = grupo && grupo.querySelector('.pill.selected');
  return sel ? sel.dataset.val : null;
}
function valorToggle(id){
  const el = document.getElementById(id);
  return el ? el.classList.contains('on') : false;
}

function leerEspecificaciones(tipo){
  const base = {
    alto: parseFloat(document.getElementById('specAlto').value) || null,
    ancho: parseFloat(document.getElementById('specAncho').value) || null,
  };
  if(tipo === 'Combo'){
    base.variante = valorPills('specVariante');
  } else if(tipo === 'Puerta de Madera'){
    base.tipo_madera = valorPills('specMadera');
    base.barniz = valorToggle('specBarniz');
  } else {
    base.vidrio_o_farquilla = valorPills('specVidrio');
    base.manillon = valorToggle('specManillon');
    if(tipo !== 'Portón'){
      base.marco_decorativo = valorToggle('specMarco');
      base.proteccion = valorToggle('specProteccion');
    }
  }
  return base;
}

// ---------- Fotos ----------
function pintarSlotsFotos(tipo, fotosExistentes = {}){
  const cont = document.getElementById('fotosTipo');
  const colores = coloresPorTipo(tipo);
  cont.innerHTML = colores.map(c=>{
    const previa = (fotosPendientes[c] && fotosPendientes[c].previewUrl) || fotosExistentes[c] || '';
    return `
      <div class="foto-slot" data-color="${c}">
        ${previa ? `<img src="${previa}">` : ''}
        <div class="foto-slot-label">${c}</div>
        <input type="file" accept="image/*" capture="environment" data-color="${c}">
      </div>`;
  }).join('');
  cont.querySelectorAll('input[type=file]').forEach(inp=>{
    inp.onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      toast('Comprimiendo foto...');
      const blob = await comprimirFoto(file);
      const previewUrl = URL.createObjectURL(blob);
      fotosPendientes[inp.dataset.color] = { blob, previewUrl };
      pintarSlotsFotos(tipo, fotosExistentes);
      toast('Foto lista (' + Math.round(blob.size/1024) + ' KB)');
    };
  });
}

// ---------- Pills de tipo (arriba del sheet) ----------
function pintarPillsTipo(seleccionado){
  const cont = document.getElementById('pillsTipo');
  cont.innerHTML = TIPOS.map(t=>`<button type="button" class="pill ${t===seleccionado?'selected':''}" data-tipo="${t}">${t}</button>`).join('');
  cont.querySelectorAll('.pill').forEach(p=>{
    p.onclick = ()=>{
      cont.querySelectorAll('.pill').forEach(x=>x.classList.remove('selected'));
      p.classList.add('selected');
      tipoSeleccionado = p.dataset.tipo;
      renderCamposEspecificos(tipoSeleccionado);
      pintarSlotsFotos(tipoSeleccionado, editandoId ? (modelos.find(m=>m.id===editandoId)?.fotos || {}) : {});
    };
  });
}

// ---------- Abrir / cerrar hoja ----------
function abrirSheet(id = null){
  editandoId = id;
  fotosPendientes = {};
  const modelo = id ? modelos.find(m=>m.id===id) : null;
  document.getElementById('sheetTitulo').textContent = modelo ? 'Editar modelo' : 'Nuevo modelo';
  document.getElementById('fNombre').value = modelo?.nombre || '';
  document.getElementById('fPrecio').value = modelo?.precio_base || '';
  document.getElementById('fBadge').value = modelo?.badge || '';
  document.getElementById('fDescripcion').value = modelo?.descripcion_publica || '';
  tipoSeleccionado = modelo?.tipo || TIPOS[0];
  pintarPillsTipo(tipoSeleccionado);
  renderCamposEspecificos(tipoSeleccionado, modelo?.especificaciones_base || {});
  pintarSlotsFotos(tipoSeleccionado, modelo?.fotos || {});
  document.getElementById('scrim').classList.add('open');
  document.getElementById('sheetModelo').classList.add('open');
}
function cerrarSheet(){
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('sheetModelo').classList.remove('open');
}
document.getElementById('btnNuevo').onclick = ()=> abrirSheet(null);
document.getElementById('btnCerrarSheet').onclick = cerrarSheet;
document.getElementById('scrim').onclick = cerrarSheet;

// ---------- Guardar ----------
document.getElementById('btnGuardarModelo').onclick = async ()=>{
  const nombre = document.getElementById('fNombre').value.trim();
  if(!nombre){ toast('Falta el nombre del modelo'); return; }
  const btn = document.getElementById('btnGuardarModelo');
  btn.disabled = true; btn.textContent = 'Guardando...';

  try{
    // Subir fotos pendientes a Supabase Storage
    const fotosExistentes = editandoId ? (modelos.find(m=>m.id===editandoId)?.fotos || {}) : {};
    const fotosFinal = { ...fotosExistentes };
    for(const color of Object.keys(fotosPendientes)){
      const { blob } = fotosPendientes[color];
      const path = `${nombre.replace(/[^a-zA-Z0-9]+/g,'_')}_${color}_${Date.now()}.jpg`;
      const { error: upErr } = await supabase.storage.from('catalogo-fotos').upload(path, blob, { contentType:'image/jpeg' });
      if(upErr) throw upErr;
      const { data: pub } = supabase.storage.from('catalogo-fotos').getPublicUrl(path);
      fotosFinal[color] = pub.publicUrl;
    }

    const payload = {
      nombre,
      tipo: tipoSeleccionado,
      fotos: fotosFinal,
      especificaciones_base: leerEspecificaciones(tipoSeleccionado),
      precio_base: parseFloat(document.getElementById('fPrecio').value) || 0,
      badge: document.getElementById('fBadge').value.trim() || null,
      descripcion_publica: document.getElementById('fDescripcion').value.trim() || null
    };

    if(editandoId){
      const { error } = await supabase.from('catalogo').update(payload).eq('id', editandoId);
      if(error) throw error;
      toast('Modelo actualizado');
    } else {
      const { error } = await supabase.from('catalogo').insert(payload);
      if(error) throw error;
      toast('Modelo guardado');
    }
    cerrarSheet();
    await cargarModelos();
  } catch(err){
    toast('Error: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar modelo';
  }
};

cargarModelos();
</script>
</body>
</html>
