<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>Traer datos de la app vieja</title>
<link rel="stylesheet" href="assets/css/base.css?v=10">
<style>
  .page{max-width:560px;margin:0 auto;padding:8px 18px 48px}
  h1{font-size:24px;font-weight:800;letter-spacing:-0.4px;margin:12px 0 6px}
  .intro{font-size:15.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 20px}
  .pasos{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;margin-bottom:20px}
  .paso{display:flex;align-items:center;gap:12px;padding:14px}
  .paso + .paso{border-top:1px solid var(--line)}
  .paso-icon{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-faint)}
  .paso.ok .paso-icon{background:var(--accent);color:#fff}
  .paso.err .paso-icon{background:var(--danger);color:#fff}
  .paso.cargando .paso-icon{background:var(--accent-soft)}
  .paso-txt{flex:1;min-width:0}
  .paso-t{font-size:15.5px;font-weight:700}
  .paso-s{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .paso .spinner{border-color:rgba(31,95,115,0.25);border-top-color:var(--accent);width:16px;height:16px}
  .final{margin-top:18px;padding:16px;border-radius:var(--radius-md);background:var(--accent-soft);color:var(--ink);font-size:15.5px;line-height:1.5;display:none}
  .final b{color:var(--accent)}
</style>
</head>
<body>
<main class="page">
  <h1>Traer datos de la app vieja</h1>
  <p class="intro">Tu teléfono le pide los datos a la app vieja y deja una copia guardada para que Claude la revise. No se cambia ni se borra nada en ninguna de las dos apps.</p>

  <div class="pasos" id="pasos"></div>
  <button class="btn-primary" id="btnLeer">Leer app vieja</button>
  <div class="final" id="final"></div>
</main>

<script src="assets/vendor/supabase.js?v=10"></script>
<script src="assets/js/supabase-client.js?v=10"></script>
<script>
(function(){
  'use strict';
  const db = window.db;
  const $ = (id) => document.getElementById(id);
  const BACKEND_VIEJO = 'https://script.google.com/macros/s/AKfycbxIDxo8LE9EuRwWAIyA-DIMrOoCXrCMBzCyUtztKtgEUKP97UGgkv31ZGP7aBsvPd32/exec';

  // Solo acciones de lectura de la app vieja
  const HOJAS = [
    { accion:'getCatalogo',       nombre:'Catálogo' },
    { accion:'getExhibicion',     nombre:'Exhibición' },
    { accion:'getCategoriasPago', nombre:'Categorías de pago' },
    { accion:'getTarifas',        nombre:'Tarifas' },
    { accion:'getPedidos',        nombre:'Pedidos' },
    { accion:'getUsuarios',       nombre:'Usuarios (sin claves)' }
  ];

  const ICON_OK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
  const ICON_X = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function pintarPasos(){
    $('pasos').innerHTML = HOJAS.map((h, i) => `
      <div class="paso" id="paso${i}">
        <span class="paso-icon"></span>
        <span class="paso-txt"><span class="paso-t" style="display:block">${h.nombre}</span><span class="paso-s" id="pasoS${i}">Pendiente</span></span>
      </div>`).join('');
  }
  function marcar(i, estado, texto){
    const el = $('paso' + i);
    el.className = 'paso ' + estado;
    el.querySelector('.paso-icon').innerHTML = estado === 'ok' ? ICON_OK : estado === 'err' ? ICON_X : estado === 'cargando' ? '<span class="spinner"></span>' : '';
    $('pasoS' + i).textContent = texto;
  }

  async function pedirViejo(accion){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 45000);
    try{
      const res = await fetch(BACKEND_VIEJO, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ accion, payload:{} }),
        signal: ctrl.signal
      });
      const json = await res.json();
      if(!json.ok) throw new Error(json.error || 'La app vieja respondió con error');
      return json.data;
    } finally { clearTimeout(t); }
  }

  async function leer(){
    const btn = $('btnLeer');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Leyendo';
    $('final').style.display = 'none';
    const lote = 'app-vieja-' + new Date().toISOString();
    let bien = 0;
    const resumen = [];
    for(let i = 0; i < HOJAS.length; i++){
      const h = HOJAS[i];
      marcar(i, 'cargando', 'Leyendo…');
      try{
        const data = await pedirViejo(h.accion);
        const lista = Array.isArray(data) ? data : (data ? [data] : []);
        const { error } = await db.from('respaldos').insert({ origen: lote, hoja: h.accion, cantidad: lista.length, datos: data });
        if(error) throw new Error('No se pudo guardar la copia: ' + error.message);
        marcar(i, 'ok', lista.length === 1 ? '1 registro guardado' : `${lista.length} registros guardados`);
        resumen.push(`${h.nombre}: ${lista.length}`);
        bien++;
      } catch(err){
        marcar(i, 'err', err.name === 'AbortError' ? 'La app vieja tardó demasiado' : (err.message || 'Error'));
      }
    }
    btn.disabled = false;
    btn.textContent = bien === HOJAS.length ? 'Leer de nuevo' : 'Reintentar';
    const f = $('final');
    f.style.display = 'block';
    f.innerHTML = bien
      ? `<b>Listo.</b> Se guardó la copia (${resumen.join(' · ')}). Avísale a Claude para que la revise.`
      : 'No se pudo leer nada. Revisa tu conexión y toca <b>Reintentar</b>.';
  }

  pintarPasos();
  $('btnLeer').addEventListener('click', leer);
  if(!db){ $('btnLeer').disabled = true; $('final').style.display = 'block'; $('final').textContent = 'No hay conexión con la base de datos nueva.'; }
})();
</script>
</body>
</html>
