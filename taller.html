<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Artesanos">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/img/icon-192.png">
<title>Taller · Herrería Artesanos</title>
<link rel="stylesheet" href="assets/css/base.css?v=80">
<style>
  .page{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 110px)}
  .p-nuevo{color:#fff!important;background:var(--danger)!important}
  .p-unidad{display:inline-block;vertical-align:2px;margin-left:4px;font-size:11.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 8px}
  .at-sub{font-size:12.5px;color:var(--ink-soft);margin:-4px 0 8px}
  .solo-lectura #btnNuevaOrden,.solo-lectura #tabsTaller{display:none}
  .btn-madera{display:flex;align-items:center;justify-content:center;height:40px;padding:0 16px;margin-top:8px;border-radius:12px;background:var(--accent);color:#fff;font-size:14px;font-weight:800;white-space:nowrap;transition:transform 130ms var(--ease-out)}
  .btn-madera:active{transform:scale(0.97)}
  .p-madera-nota{margin-top:12px;font-size:13.5px;color:var(--ink-soft)}
  .madera-foto{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border-radius:var(--radius-md);background:var(--surface-2);color:var(--ink-soft);font-size:14px;overflow:hidden;margin-bottom:10px}
  .madera-foto img{width:100%;height:100%;object-fit:cover}
  .at-paso{padding:12px 0}
  .at-paso + .at-paso{border-top:1px solid var(--line)}
  .at-nom{font-size:15px;font-weight:800;margin:0 0 8px}
  .at-ops{display:flex;flex-wrap:wrap;gap:8px}
  .at-op{display:flex;align-items:center;gap:7px;height:38px;padding:0 13px 0 5px;border-radius:999px;border:1.5px solid var(--line-strong);font-size:13.5px;font-weight:700;color:var(--ink-soft);background:var(--surface);transition:transform 120ms var(--ease-out)}
  .at-op:active{transform:scale(0.96)}
  .at-op .ini{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .at-op.nadie{padding:0 13px}
  .at-op.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .at-op.on .ini{background:var(--accent);color:#fff}
  .at-vacio{font-size:13px;color:var(--ink-soft);margin:0}

  /* Categoría de pago de cada producto */
  .p-cat{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;max-width:100%;transition:transform 130ms var(--ease-out)}
  .p-cat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-cat:active{transform:scale(0.97)}
  .p-cat.falta{background:#FFF1D6;color:#8A5A00}
  .lista-cat{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .fila-cat{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;font-size:15px;font-weight:700;transition:transform 130ms var(--ease-out),border-color 160ms var(--ease-out),background-color 160ms var(--ease-out)}
  .fila-cat:active{transform:scale(0.98)}
  .fila-cat.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .btn-cancelar-orden{display:block;width:100%;height:48px;margin-top:18px;border:1px solid #F4C7C3;border-radius:14px;color:var(--danger);font-size:14.5px;font-weight:700;transition:transform 130ms var(--ease-out)}
  .btn-cancelar-orden:active{transform:scale(0.98)}

  /* Fabricar para exhibición */
  .f-link-box{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line-strong);font-size:15px;color:var(--ink);text-align:left;transition:transform 130ms var(--ease-out)}
  .f-link-box:active{transform:scale(0.98)}
  .f-link-box .chev{margin-left:auto;color:var(--ink-faint);flex-shrink:0}
  .f-link-box .ph{color:var(--ink-faint)}
  .mini-foto{width:40px;height:40px;border-radius:10px;background:var(--surface-2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
  .mini-foto img{width:100%;height:100%;object-fit:cover}
  .mod-nom{display:block;font-weight:800}
  .mod-sub{display:block;font-size:12.5px;color:var(--ink-soft)}
  .lista-mod{display:flex;flex-direction:column;margin-top:10px}
  .fila-mod{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;text-align:left;transition:transform 130ms var(--ease-out)}
  .fila-mod + .fila-mod{border-top:1px solid var(--line)}
  .fila-mod:active{transform:scale(0.98)}
  .field-hint.aviso{color:#8A5A00}

  .cat-falta{display:block;width:100%;text-align:left;font-size:13px;line-height:1.4;color:#8A5A00;background:#FFF1D6;border-radius:12px;padding:10px 12px;margin:0 0 14px;transition:transform 130ms var(--ease-out)}
  .cat-falta:active{transform:scale(0.98)}
  .cat-falta b{font-weight:800}
  #ordenBody .field-error{margin-top:6px}
  /* Quién y para cuándo */
  .e-tope.tarde{color:var(--danger)}
  .at-nom .e-tope{margin-left:6px;font-size:12px}
  .at-cuando{margin-bottom:6px}
  .seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
  .seg-op{flex:1;min-width:0;height:40px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;transition:transform 120ms var(--ease-out),background-color 160ms var(--ease-out)}
  .seg-op:active{transform:scale(0.97)}
  .seg-op.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
  .p-foto-otra{font-size:12.5px;line-height:1.4;color:#8A5A00;background:#FFF1D6;border-radius:12px;padding:9px 12px;margin:-4px 0 14px}
  .at-link{font-weight:800;color:var(--accent);text-decoration:underline}
  /* Taller › Pedidos (maqueta T2) */
  .tl-chips .chip{height:38px;padding:0 14px}
  .tl-chips .chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .vlista{display:flex;flex-direction:column;gap:10px}
  .tl-card{border:1px solid var(--line);border-radius:18px;padding:13px 15px;background:var(--surface);cursor:pointer;animation:tlEntra 260ms var(--ease-out) both;animation-delay:calc(var(--i, 0) * 30ms)}
  @keyframes tlEntra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.tl-card{animation:none}}
  .tl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .tl-top b{font-size:16px;font-weight:800;min-width:0}
  .tl-pill{flex-shrink:0;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
  .tl-pill.am{background:#FDF3E1;color:var(--amber)}
  .tl-pill.rj{background:#FDECEA;color:var(--danger)}
  .tl-pill.ok{background:#E7F4EC;color:#1F7A4D}
  .tl-prod{margin-top:9px}
  .tl-prod > span{display:block;font-size:14.5px;font-weight:700;margin-bottom:5px}
  .tl-trk{display:flex;flex-wrap:wrap;gap:5px}
  .tl-f{font-style:normal;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
  .tl-f.h{background:var(--accent);color:#fff}
  .tl-f.p{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .tl-f.a{background:var(--surface-2);color:var(--ink)}
  .tl-f.s{background:#FDF3E1;color:var(--amber);box-shadow:inset 0 0 0 1.5px #E8C98F}
  .tl-f.w{background:var(--surface);color:#B5B0A8;box-shadow:inset 0 0 0 1px var(--line)}
  .tl-f.r{background:#FDECEA;color:var(--danger);box-shadow:inset 0 0 0 1.5px #F2B8B2}
  .tl-pie{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-soft)}
  .tl-pie > span{min-width:0}
  .tl-pie .rojo{color:var(--danger);font-weight:600}
  .tl-abrir{flex-shrink:0;min-height:44px;padding:0 2px 0 10px;font-size:14.5px;font-weight:800;color:var(--accent);white-space:nowrap;transition:transform 120ms var(--ease-out)}
  .tl-btn-asignar{flex-shrink:0;height:40px;padding:0 18px;border-radius:999px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;white-space:nowrap;transition:transform 120ms var(--ease-out)}
  .tl-abrir:active,.tl-btn-asignar:active{transform:scale(0.97)}
  .tl-kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .tl-kv div{background:var(--surface-2);border-radius:12px;padding:9px 12px}
  .tl-kv span{display:block;font-size:12.5px;color:var(--ink-soft)}
  .tl-kv b{font-size:15.5px;font-weight:800}
  .tl-kv b.ok{color:#1F7A4D}
  .tl-kv b.debe{color:var(--danger)}
  .tl-ats{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
  .tl-ats a,.tl-ats button{text-decoration:none;display:inline-flex;align-items:center;min-height:36px;padding:0 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:700;white-space:nowrap;transition:transform 120ms var(--ease-out)}
  .tl-ats a:active,.tl-ats button:active{transform:scale(0.97)}
  .tl-entregar{width:100%;margin-top:2px;background:var(--accent)}
  .tl-nota{font-size:13px;line-height:1.4;color:var(--ink-soft);text-align:center;margin:12px 6px 0}
  .tl-vacio-btn{margin-top:12px}
  /* Drawer del pedido (T3) */
  .tl-dt{font-size:21px;font-weight:800;letter-spacing:-.3px;padding-right:44px}
  .tl-ds{font-size:14px;color:var(--ink-soft);margin-top:3px}
  .tl-unidad{margin-top:14px}
  .tl-uh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
  .tl-uh-t{min-width:0}
  .tl-uh-t b{font-size:14.5px;font-weight:800;color:var(--ink-soft)}
  .tl-uh-s{display:block;font-size:12.5px;color:var(--ink-faint)}
  .e-rama-tit{font-size:11.5px;font-weight:800;letter-spacing:.3px;color:var(--ink-faint);text-transform:uppercase;margin:12px 0 2px}
  .e-rama-inc{font-size:12.5px;color:var(--ink-soft);margin:0 0 4px}
  .tl-paso{display:flex;align-items:center;gap:11px;padding:10px 0}
  .tl-paso + .tl-paso{border-top:1px solid var(--line)}
  .tl-paso[data-foto]{cursor:pointer}
  .tl-dot{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:var(--surface-2);color:var(--ink-soft)}
  .tl-dot.h{background:var(--accent);color:#fff}
  .tl-dot.p{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
  .tl-dot.s{background:#FDF3E1;color:var(--amber)}
  .tl-dot.w{color:#B5B0A8}
  .tl-dot.r{background:#FDECEA;color:var(--danger)}
  .tl-pt{flex:1;min-width:0}
  .tl-pt .e-nom{display:block;font-size:15px;font-weight:800}
  .tl-ps{display:block;font-size:13px;color:var(--ink-soft);margin-top:1px}
  .tl-paso.r .tl-ps{color:var(--danger)}
  .e-por{color:var(--amber);font-weight:600}
  .e-ahora{color:var(--accent);font-weight:600}
  .tl-mini{width:42px;height:42px;border-radius:10px;overflow:hidden;background:var(--surface-2);flex-shrink:0}
  .tl-mini img{width:100%;height:100%;object-fit:cover}
  .tl-monto{flex-shrink:0;text-align:right;font-size:15px;font-weight:800;white-space:nowrap}
  .tl-monto small{display:block;font-size:12px;font-weight:600;color:var(--ink-soft)}
  .tl-monto small.pp{color:var(--amber)}
  .tl-carry{background:#FDECEA;color:var(--danger);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;line-height:1.4;margin:6px 0 2px}
  /* Hoja de Asignar (la de siempre) con lo que se paga a la derecha */
  .sheet-sub{font-size:14px;color:var(--ink-soft)}
  .at-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
  .at-cab .at-nom{margin:0}
  .at-monto{flex-shrink:0;font-size:13.5px;color:var(--ink-soft);white-space:nowrap}
  .at-op.fijo{opacity:.65}
  .e-tope{font-size:12px;font-weight:700;color:var(--ink-soft)}
  .e-tope.tarde{color:var(--danger)}
</style>
</head>
<body data-requiere-sesion="si" data-modo="produccion">

<header class="topbar" id="topbar">
  <div class="logo-mark con-img"><img src="assets/img/icon-192.png" alt="Herrería Artesanos"></div>
  <div class="topbar-text">
    <div class="topbar-title">Taller</div>
    <div class="topbar-sub" id="subtitulo">Cargando</div>
  </div>
  <button class="icon-btn" id="btnActualizar" aria-label="Actualizar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
</header>

<main class="page">
  <nav class="tabs-mod" id="tabsTaller" aria-label="Partes del taller">
    <a href="taller.html" class="on" aria-current="page">Pedidos</a>
    <a href="nomina.html">Nómina</a>
  </nav>
  <div class="chips tl-chips" id="chips" role="tablist"></div>
  <section class="vlista" id="lista" aria-live="polite">
    <div class="sk-vcard"></div><div class="sk-vcard"></div><div class="sk-vcard"></div>
  </section>
</main>

<div class="bottom-nav-wrap" id="menuModulos" data-activo="taller"></div>

<button class="fab" id="btnNuevaOrden" aria-label="Fabricar para exhibición">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Ficha del pedido: productos y sus etapas -->
<div class="sheet-scrim" id="scrimFicha" data-cerrar="sheetFicha"></div>
<section class="sheet sheet-auto" id="sheetFicha" role="dialog" aria-modal="true" aria-label="Pedido">
  <div class="sheet-handle"></div>
  <button class="sheet-x" data-cerrar="sheetFicha" aria-label="Cerrar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="sheet-body" id="fichaBody" style="padding-top:18px"></div>
</section>

<!-- Asignar trabajadores: quién hace cada paso y para cuándo -->
<div class="sheet-scrim scrim-top" id="scrimTodo" data-cerrar="sheetTodo"></div>
<section class="sheet sheet-auto sheet-top" id="sheetTodo" role="dialog" aria-modal="true" aria-labelledby="todoTitulo">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 class="sheet-title" id="todoTitulo">Asignar trabajadores</h2>
    <button class="icon-btn" data-cerrar="sheetTodo" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body">
    <p class="sheet-sub" id="todoSub" style="margin:-4px 0 6px"></p>
    <p class="field-hint" style="margin:0 0 12px">Elige quién hace cada paso. A cada uno le llega el aviso cuando le toque.</p>
    <div id="todoBody"></div>
  </div>
  <div class="sheet-foot"><button class="btn-primary" type="button" id="btnGuardarTodo" disabled>Elige quién hace cada paso</button></div>
</section>

<div class="sheet-scrim scrim-top" id="scrimCatItem" data-cerrar="sheetCatItem"></div>
<section class="sheet sheet-auto sheet-top" id="sheetCatItem" role="dialog" aria-modal="true" aria-labelledby="catItemTitulo">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 class="sheet-title" id="catItemTitulo">Categoría de pago</h2>
    <button class="icon-btn" data-cerrar="sheetCatItem" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body">
    <p class="field-label" id="catItemSub" style="margin-bottom:10px"></p>
    <div class="lista-cat" id="listaCatItem"></div>
  </div>
</section>

<!-- Fabricar para exhibición -->
<div class="sheet-scrim" id="scrimOrden" data-cerrar="sheetOrden"></div>
<section class="sheet sheet-auto" id="sheetOrden" role="dialog" aria-modal="true" aria-labelledby="ordenTitulo">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 class="sheet-title" id="ordenTitulo">Fabricar para exhibición</h2>
    <button class="icon-btn" data-cerrar="sheetOrden" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="ordenBody"></div>
  <div class="sheet-foot"><button class="btn-primary" type="button" id="btnCrearOrden">Mandar a fabricar</button></div>
</section>

<!-- Elegir modelo -->
<div class="sheet-scrim scrim-top" id="scrimModelos" data-cerrar="sheetModelos"></div>
<section class="sheet sheet-top" id="sheetModelos" role="dialog" aria-modal="true" aria-labelledby="modelosTitulo">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 class="sheet-title" id="modelosTitulo">Elige el modelo</h2>
    <button class="icon-btn" data-cerrar="sheetModelos" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body">
    <label class="search-box" style="margin:0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="buscaModelo" placeholder="Buscar modelo" autocomplete="off" aria-label="Buscar modelo">
    </label>
    <div class="lista-mod" id="listaModelos"></div>
  </div>
</section>

<div class="sheet-scrim scrim-top" id="scrimMadera" data-cerrar="sheetMadera"></div>
<section class="sheet sheet-auto sheet-top" id="sheetMadera" role="dialog" aria-modal="true" aria-labelledby="maderaTitulo">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 class="sheet-title" id="maderaTitulo">Terminar paso</h2>
    <button class="icon-btn" data-cerrar="sheetMadera" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body">
    <p class="sheet-sub" id="maderaSub" style="margin-bottom:12px"></p>
    <div class="madera-foto" id="maderaFoto"></div>
    <button class="btn-secondary" type="button" id="btnMaderaFoto" style="width:100%">Tomar la foto</button>
    <input type="file" accept="image/*" capture="environment" id="maderaInput" class="hidden">
  </div>
  <div class="sheet-foot"><button class="btn-primary" type="button" id="btnMaderaOk" disabled>Primero toma la foto</button></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/vendor/supabase.js?v=80"></script>
<script src="assets/js/supabase-client.js?v=80"></script>
<script src="assets/js/img-compress.js?v=80"></script>
<script src="assets/js/comun.js?v=80"></script>
<script src="assets/js/avisos.js?v=80"></script>
<script src="assets/js/sesion.js?v=80"></script>
<script src="assets/js/ayuda.js?v=80"></script>
<script src="assets/js/ventas-comun.js?v=80"></script>
<script src="assets/js/specs-producto.js?v=80"></script>
<script src="assets/js/taller.js?v=80"></script>
</body>
</html>
