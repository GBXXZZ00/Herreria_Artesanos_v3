<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Artesanos">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/icon-192.png">
<title>Costos · Herrería Artesanos</title>
<link rel="stylesheet" href="assets/css/base.css?v=71">
<link rel="stylesheet" href="assets/css/modulo.css?v=71">
<style>
  /* Costos: lista de modelos con semáforo y ficha de costeo (al lado en computadora) */
  .sem-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .pill.negro{background:var(--ink);color:#fff}
  .mod{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;text-align:left;transition:transform 140ms var(--ease-out)}
  .mod:active{transform:scale(0.98)}
  .mod + .mod{border-top:1px solid var(--line)}
  .mod img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--surface-2);flex-shrink:0}
  .mod .grow{flex:1;min-width:0}
  .mod .mat-n b{font-size:17px}
  .mod.sel{background:var(--accent-soft);border-radius:14px}
  .precio-caja{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 8px}
  .precio-caja .res-c b{font-size:22px}
  .precio-caja .res-c.final{grid-column:1/-1;background:var(--accent);}
  .precio-caja .res-c.final span,.precio-caja .res-c.final b{color:#fff}
  .grp{margin-top:6px}
  .grp-h{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--ink-soft);padding:12px 2px 4px;border-bottom:1px solid var(--line)}
  .ln{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 2px;width:100%;text-align:left}
  .ln + .ln{border-top:1px solid var(--line)}
  .ln-t{font-size:14.5px;font-weight:700}
  .ln-s{font-size:12.5px;color:var(--ink-soft)}
  .ln-v{font-size:14.5px;font-weight:800;text-align:right;white-space:nowrap}
  button.ln:active{background:var(--surface-2)}
  .pz{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 2px;width:100%;text-align:left}
  .pz + .pz{border-top:1px solid var(--line)}
  .pz-n{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .pz-t{font-size:14.5px;font-weight:700}
  .pz-s{display:block;font-size:12.5px;color:var(--ink-soft)}
  .pz-m{font-size:15px;font-weight:800;white-space:nowrap}
  .barra-t{font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:10px}
  .tog{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
  .regla{display:flex;align-items:center;gap:10px;width:100%;padding:13px 2px;text-align:left}
  .regla + .regla{border-top:1px solid var(--line)}
  .regla .grow{flex:1;min-width:0}
  .regla b{font-size:18px;font-weight:800;white-space:nowrap}
  .formula{border-radius:16px;background:var(--surface-2);padding:12px 14px;font-size:14px;line-height:1.55}
  .formula b{color:var(--accent)}
  .leyenda{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;margin-top:8px}
  .prov-p{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0}
  .prov-p + .prov-p{border-top:1px solid var(--line)}
  .col-t{display:none}
  @media (min-width:1024px){
    .page{max-width:1400px;margin:0 auto}
    .cos-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:start}
    #panel{position:sticky;top:76px;border:1px solid var(--line);border-radius:18px;padding:16px;max-height:calc(100vh - 100px);overflow:auto}
    #panel:empty::before{content:"Toca un modelo para ver su costeo aquí.";color:var(--ink-soft);font-size:14px}
    .pie-entregar{display:none}
    .seg-d{max-width:560px}
  }
  @media (max-width:1023px){ #panel{display:none} }
</style>
</head>
<body data-requiere-sesion="si">

<header class="topbar" id="topbar">
  <div class="logo-mark con-img"><img src="assets/img/icon-192.png" alt="Herrería Artesanos"></div>
  <div class="topbar-text">
    <div class="topbar-title">Costos</div>
    <div class="topbar-sub" id="subtitulo">Cuánto cuesta cada modelo</div>
  </div>
</header>

<main class="page">
  <div class="maq">Maqueta. Precios de la Memoria central; el Bitral es el modelo de ejemplo. <button type="button" id="btnReiniciar">Volver a empezar</button></div>
  <div class="seg-d" id="tabs" role="group" aria-label="Qué ver">
    <span class="seg-fondo" aria-hidden="true"></span>
    <button class="on" type="button" data-tab="modelos" aria-pressed="true">Modelos</button>
    <button type="button" data-tab="materiales" aria-pressed="false">Materiales</button>
    <button type="button" data-tab="reglas" aria-pressed="false">Reglas</button>
  </div>
  <div class="mostrar" id="filtros"><span class="mostrar-t">Mostrar</span><div class="mostrar-l" id="filtrosL"></div></div>
  <section class="d-cont" id="cont" aria-live="polite"></section>
</main>

<div class="pie-entregar hidden" id="pieMat"><button class="btn-primary" type="button" id="btnNuevoMat">Agregar material</button></div>

<div class="bottom-nav-wrap" id="menuModulos" data-activo="costos"></div>

<div class="sheet-scrim" id="scrimDet" data-cerrar="sheetDet"></div>
<section class="sheet" id="sheetDet" role="dialog" aria-modal="true" aria-labelledby="detTitulo">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 class="sheet-title" id="detTitulo">Costeo</h2>
    <button class="icon-btn" data-cerrar="sheetDet" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="sheet-body" id="detBody"></div>
  <div class="sheet-foot" id="detFoot"></div>
</section>

<div class="sheet-scrim scrim-top" id="scrimForm" data-cerrar="sheetForm"></div>
<section class="sheet sheet-auto sheet-top" id="sheetForm" role="dialog" aria-modal="true" aria-labelledby="formTitulo">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 class="sheet-title" id="formTitulo">Formulario</h2>
    <button class="icon-btn" data-cerrar="sheetForm" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="sheet-body" id="formBody"></div>
  <div class="sheet-foot" id="formFoot"><button class="btn-primary" type="button" id="btnForm">Guardar</button></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/falso.js?v=71"></script>
<script src="assets/vendor/supabase.js?v=71"></script>
<script src="assets/js/supabase-client.js?v=71"></script>
<script src="assets/js/comun.js?v=71"></script>
<script src="assets/js/sesion.js?v=71"></script>
<script src="assets/js/costos.js?v=71"></script>
</body>
</html>
