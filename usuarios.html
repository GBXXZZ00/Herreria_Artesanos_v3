<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Artesanos">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/img/icon-192.png">
<title>Usuarios · Herrería Artesanos</title>
<link rel="stylesheet" href="assets/css/base.css?v=38">
<style>
  .page{padding-bottom:calc(var(--safe-b) + 110px)}
  .u-vlista{display:flex;flex-direction:column;gap:10px;padding:14px 18px 0}
  .u-card{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);transition:transform 140ms var(--ease-out);opacity:0;transform:translateY(8px);animation:tileIn 360ms var(--ease-out) forwards;animation-delay:calc(var(--i,0) * 35ms)}
  .u-card:active{transform:scale(0.98)}
  .u-card.inactivo{opacity:.55}
  .u-card.inactivo{animation:none;opacity:.55;transform:none}
  .u-avatar-wrap{position:relative;flex-shrink:0}
  .u-avatar{width:44px;height:44px;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .u-rolico{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}
  .u-rolico svg{width:11px;height:11px}
  .u-body{flex:1;min-width:0}
  .u-nombre{font-size:15.5px;font-weight:800}
  .u-sub{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:1px}
  .u-esp-fila{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .u-esp{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border-radius:999px;padding:3px 9px}
  .u-badge{font-size:11px;font-weight:700;color:var(--ink-faint);background:var(--surface-2);border-radius:999px;padding:4px 10px;flex-shrink:0}
  .u-flecha{color:var(--ink-faint);flex-shrink:0}
  .f-link{display:flex;align-items:center;justify-content:space-between;padding:15px 2px;font-size:15.5px;font-weight:700;color:var(--ink);text-decoration:none;transition:transform 130ms var(--ease-out)}
  .f-link:active{transform:scale(0.99)}
  button.f-link{width:100%;text-align:left;border:0;background:none}
  .f-link + .f-link{border-top:1px solid var(--line)}
  .btn-peligro{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;margin-top:16px;border:1px solid #F4C7C3;border-radius:14px;background:none;color:var(--danger);font-size:15px;font-weight:700;transition:transform 130ms var(--ease-out),background-color 160ms var(--ease-out)}
  .btn-peligro:active{transform:scale(0.98);background:#FDECEA}
  .u-ficha-cab{display:flex;align-items:center;gap:12px;padding:6px 0 16px}
  .u-ficha-cab .u-avatar{width:52px;height:52px;font-size:19px}
  .u-vacio{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:15px}
</style>
</head>
<body data-requiere-sesion="si">

<header class="topbar" id="topbar">
  <div class="logo-mark con-img"><img src="assets/img/icon-192.png" alt="Herrería Artesanos"></div>
  <div class="topbar-text">
    <div class="topbar-title">Usuarios</div>
    <div class="topbar-sub" id="subtitulo">Cargando</div>
  </div>
</header>

<main class="page">
  <section class="u-vlista" id="lista" aria-live="polite">
    <div class="sk-vcard"></div><div class="sk-vcard"></div><div class="sk-vcard"></div>
  </section>
</main>

<div class="hidden" id="menuModulos" data-activo="usuarios"></div>

<button class="fab" id="btnNuevo" aria-label="Nuevo usuario">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Nuevo usuario -->
<div class="sheet-scrim" id="scrimNuevo" data-cerrar="sheetNuevo"></div>
<section class="sheet sheet-auto" id="sheetNuevo" role="dialog" aria-modal="true" aria-labelledby="nuevoTitulo2">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 class="sheet-title" id="nuevoTitulo2">Nuevo usuario</h2>
    <button class="icon-btn" data-cerrar="sheetNuevo" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label class="field-label" for="nNombre">Nombre</label>
      <input class="input" id="nNombre" type="text" autocomplete="off" autocapitalize="words">
      <p class="field-error" id="eNombre"></p>
    </div>
    <div class="field">
      <label class="field-label" for="nUsuario">Usuario (para entrar)</label>
      <input class="input" id="nUsuario" type="text" autocomplete="off" autocapitalize="none" placeholder="ej: pedro">
      <p class="field-error" id="eUsuario"></p>
    </div>
    <div class="field">
      <label class="field-label" for="nPin">PIN inicial (6 números)</label>
      <input class="input" id="nPin" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="123456">
      <p class="field-error" id="ePin"></p>
    </div>
    <div class="field">
      <label class="field-label">Tipo de cuenta</label>
      <div class="opts" style="--cols:3" id="nRol">
        <button type="button" class="opt" data-v="vendedor">Vendedor</button>
        <button type="button" class="opt" data-v="trabajador">Trabajador</button>
        <button type="button" class="opt" data-v="admin">Admin</button>
      </div>
    </div>
    <div class="field hidden" id="fEspecialidad">
      <label class="field-label">Especialidades (puedes elegir más de una)</label>
      <div class="opts" style="--cols:2" id="nEspecialidad">
        <button type="button" class="opt" data-v="herrero">Herrero</button>
        <button type="button" class="opt" data-v="masilla_pintura">Masilla y pintura</button>
        <button type="button" class="opt" data-v="acabados">Detalles</button>
        <button type="button" class="opt" data-v="ventanero">Ventanero</button>
        <button type="button" class="opt" data-v="carpintero">Carpintero</button>
      </div>
      <p class="field-error" id="eEspecialidad"></p>
    </div>
  </div>
  <div class="sheet-foot"><button class="btn-primary" type="button" id="btnCrear">Crear usuario</button></div>
</section>

<!-- Ficha de usuario -->
<div class="sheet-scrim" id="scrimFicha" data-cerrar="sheetFicha"></div>
<section class="sheet sheet-auto" id="sheetFicha" role="dialog" aria-modal="true" aria-label="Usuario">
  <div class="sheet-handle"></div>
  <button class="sheet-x" data-cerrar="sheetFicha" aria-label="Cerrar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="sheet-body" id="fichaBody" style="padding-top:18px"></div>
</section>

<!-- Nuevo PIN para el usuario -->
<div class="sheet-scrim scrim-top" id="scrimPin2" data-cerrar="sheetPin2"></div>
<section class="sheet sheet-auto sheet-top" id="sheetPin2" role="dialog" aria-modal="true" aria-labelledby="pin2Titulo">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 class="sheet-title" id="pin2Titulo">Restablecer PIN</h2>
    <button class="icon-btn" data-cerrar="sheetPin2" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label class="field-label" for="rPin">PIN nuevo (6 números)</label>
      <input class="input" id="rPin" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="123456">
      <p class="field-error" id="eRPin"></p>
    </div>
  </div>
  <div class="sheet-foot"><button class="btn-primary" type="button" id="btnGuardarPin">Guardar PIN</button></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/vendor/supabase.js?v=38"></script>
<script src="assets/js/supabase-client.js?v=38"></script>
<script src="assets/js/comun.js?v=38"></script>
<script src="assets/js/sesion.js?v=38"></script>
<script src="assets/js/usuarios.js?v=38"></script>
</body>
</html>
