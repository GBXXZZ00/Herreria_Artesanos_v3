<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Artesanos">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/icon-192.png">
<title>Finanzas · Herrería Artesanos</title>
<link rel="stylesheet" href="assets/css/base.css?v=71">
<link rel="stylesheet" href="assets/css/modulo.css?v=71">
<style>
  /* Finanzas: en el teléfono, pestañas y hojas que se apilan; en computadora, todo al lado */
  .seg-d.en-3 .seg-fondo{transform:translateX(200%)}
  .fx-saldo{display:block;font-size:12px;font-weight:700;margin-top:1px}
  .s-favor{color:var(--accent)} .s-debe{color:#B42318} .s-cero{color:var(--ink-soft)}
  .mat-n b.s-favor{color:var(--accent)} .mat-n b.s-debe{color:#B42318}
  .grande{border-radius:18px;padding:16px;background:var(--surface-2);margin-bottom:12px}
  .grande span{display:block;font-size:13px;font-weight:800;color:var(--ink-soft)}
  .grande b{display:block;font-size:34px;font-weight:800;letter-spacing:-0.8px;margin-top:2px}
  .grande p{margin:4px 0 0;font-size:13px;color:var(--ink-soft)}
  .grande.favor{background:#E6F0F0} .grande.favor b{color:var(--accent)}
  .grande.debe{background:#FDF1EF} .grande.debe b{color:#B42318}
  .dinero-l{display:flex;flex-direction:column}
  .rep{border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .rep-f{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;font-size:15px;font-weight:700}
  .rep-f + .rep-f{border-top:1px solid var(--line)}
  button.rep-f:active{background:var(--surface-2)}
  .rep-f b{font-size:16px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
  .rep-f.total{background:var(--surface-2);font-size:16px}
  .rep-f.total b{font-size:20px}
  .din{display:flex;align-items:center;gap:10px;padding:11px 2px;width:100%;text-align:left}
  .din + .din{border-top:1px solid var(--line)}
  .din .din-t{flex:1;min-width:0;font-size:15px;font-weight:700}
  .din .din-t small{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .din b{font-size:17px;font-weight:800;white-space:nowrap}
  .din.total{border-top:2px solid var(--ink) !important;margin-top:2px}
  .din.total b{font-size:20px}
  .lib{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 2px;width:100%;text-align:left}
  .lib + .lib{border-top:1px solid var(--line)}
  .lib-t{font-size:14.5px;font-weight:700}
  .lib-s{font-size:12.5px;color:var(--ink-soft)}
  .lib-m{text-align:right;font-size:15px;font-weight:800;white-space:nowrap}
  .lib-c{text-align:right;font-size:12px;color:var(--ink-soft);white-space:nowrap}
  .lib.anulado .lib-t,.lib.anulado .lib-m{text-decoration:line-through;color:var(--ink-faint)}
  .ub{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1.5px solid #E9C46A;background:#FFFBEB;width:100%;text-align:left}
  .ub + .ub{margin-top:8px}
  .ub.conf{border-color:#F4C7C3;background:#FFF5F4} .ub.conf small{color:#7A1A12}
  .comp{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--surface-2);font-size:14px;font-weight:700}
  .comp img{width:56px;height:56px;border-radius:10px;object-fit:cover}
  .comp small{font-weight:600;color:var(--ink-soft)}
  .ub .grow{flex:1;min-width:0}
  .ub b{display:block;font-size:15px}
  .ub small{font-size:12.5px;color:#6B5500}
  .ub .m{font-size:18px;font-weight:800}
  .gasto{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 2px}
  .gasto + .gasto{border-top:1px solid var(--line)}
  .pie-dos2{display:flex;gap:10px;margin-top:6px}
  .pie-dos2 > *{flex:1}
  .ini-cab{display:flex;align-items:center;gap:10px}
  /* Estado de cuenta (se ve como el PDF de la venta) */
  .pdf{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px 16px;font-family:Helvetica,Arial,sans-serif;color:#1C1A17}
  .pdf-h{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--accent);padding-bottom:10px}
  .pdf-h img{width:44px;height:44px;object-fit:contain}
  .pdf-h div{margin-left:auto;text-align:right}
  .pdf-h b{display:block;color:var(--accent);font-size:17px}
  .pdf-h span{font-size:11px;color:#6E6A64}
  .pdf-banda{background:var(--accent);color:#fff;font-weight:700;font-size:12px;padding:6px 8px;margin:12px 0 8px}
  .pdf table{width:100%;border-collapse:collapse;font-size:10.5px}
  .pdf th{text-align:left;color:#6E6A64;font-weight:700;border-bottom:1px solid #D9D6D0;padding:4px 3px}
  .pdf td{padding:5px 3px;border-bottom:1px solid #EFEDE9;vertical-align:top}
  .pdf .r{text-align:right;white-space:nowrap}
  .pdf-caja{background:#F7F6F4;padding:10px;margin-top:10px;display:flex;justify-content:space-between;font-size:12px}
  .pdf-caja b{font-size:14px}
  .pdf-firmas{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px;font-size:10.5px;color:#6E6A64}
  .pdf-firmas div{border-top:1px solid #1C1A17;padding-top:4px}
  .tw{overflow-x:auto}
  /* Computadora: todo al lado (estilo Ray) */
  .col-t{display:none}
  @media (min-width:1024px){
    .page{max-width:1500px;margin:0 auto}
    #tabs,#subFin{display:none !important}
    .fin-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
    .fin-col{min-width:0}
    .col-t{display:block;font-size:13px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:4px 2px 10px}
    #panel{position:sticky;top:76px;border:1px solid var(--line);border-radius:18px;padding:16px;max-height:calc(100vh - 100px);overflow:auto}
    #panel:empty::before{content:"Toca un proveedor o una cuenta para ver su detalle aquí.";color:var(--ink-soft);font-size:14px}
    .pie-entregar{display:none}
  }
  @media (max-width:1023px){ #panel{display:none} .fin-col.oculta{display:none} }
</style>
</head>
<body data-requiere-sesion="si">

<header class="topbar" id="topbar">
  <div class="logo-mark con-img"><img src="assets/img/icon-192.png" alt="Herrería Artesanos"></div>
  <div class="topbar-text">
    <div class="topbar-title">Finanzas</div>
    <div class="topbar-sub" id="subtitulo">Dónde está tu dinero</div>
  </div>
</header>

<main class="page">
  <div class="maq">Maqueta con datos de ejemplo. Los saldos los llena Ray. <button type="button" id="btnReiniciar">Volver a empezar</button></div>
  <div class="seg-d" id="tabs" role="group" aria-label="Qué ver">
    <span class="seg-fondo" aria-hidden="true"></span>
    <button class="on" type="button" data-tab="dinero" aria-pressed="true">Dinero</button>
    <button type="button" data-tab="prov" aria-pressed="false">Proveedores</button>
    <button type="button" data-tab="gastos" aria-pressed="false">Gastos</button>
  </div>
  <section class="d-cont" id="cont" aria-live="polite"></section>
</main>

<div class="pie-entregar hidden" id="pieProv"><button class="btn-primary" type="button" id="btnNuevoProv">Agregar proveedor</button></div>
<div class="pie-entregar hidden" id="pieGasto"><button class="btn-primary" type="button" id="btnNuevoGasto">Registrar gasto</button></div>

<div class="bottom-nav-wrap" id="menuModulos" data-activo="finanzas"></div>

<!-- Detalle: proveedor o cuenta (en computadora va al lado, en el panel) -->
<div class="sheet-scrim" id="scrimDet" data-cerrar="sheetDet"></div>
<section class="sheet" id="sheetDet" role="dialog" aria-modal="true" aria-labelledby="detTitulo">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 class="sheet-title" id="detTitulo">Detalle</h2>
    <button class="icon-btn" data-cerrar="sheetDet" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="sheet-body" id="detBody"></div>
  <div class="sheet-foot" id="detFoot"></div>
</section>

<!-- Formularios encima del detalle -->
<div class="sheet-scrim scrim-top" id="scrimForm" data-cerrar="sheetForm"></div>
<section class="sheet sheet-auto sheet-top" id="sheetForm" role="dialog" aria-modal="true" aria-labelledby="formTitulo">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 class="sheet-title" id="formTitulo">Formulario</h2>
    <button class="icon-btn" data-cerrar="sheetForm" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="sheet-body" id="formBody"></div>
  <div class="sheet-foot"><button class="btn-primary" type="button" id="btnForm">Guardar</button></div>
</section>

<!-- Estado de cuenta (PDF) -->
<div class="sheet-scrim scrim-top" id="scrimPdf" data-cerrar="sheetPdf"></div>
<section class="sheet sheet-top" id="sheetPdf" role="dialog" aria-modal="true" aria-labelledby="pdfTitulo">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h2 class="sheet-title" id="pdfTitulo">Estado de cuenta</h2>
    <button class="icon-btn" data-cerrar="sheetPdf" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="sheet-body" id="pdfBody"></div>
  <div class="sheet-foot"><button class="btn-primary" type="button" id="btnCompartirPdf">Compartir PDF</button></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/falso.js?v=71"></script>
<script src="assets/vendor/supabase.js?v=71"></script>
<script src="assets/js/supabase-client.js?v=71"></script>
<script src="assets/js/comun.js?v=71"></script>
<script src="assets/js/sesion.js?v=71"></script>
<script src="assets/js/finanzas.js?v=71"></script>
</body>
</html>
