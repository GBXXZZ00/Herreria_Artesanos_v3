<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/icon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<title>Tu pedido · Herrería Artesanos</title>
<link rel="stylesheet" href="assets/css/base.css?v=30">
<style>
  body{background:var(--surface-2)}
  .seg{max-width:560px;margin:0 auto;padding:calc(18px + var(--safe-t)) 16px calc(32px + var(--safe-b))}
  .seg-marca{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .seg-marca img{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:#fff}
  .seg-marca b{display:block;font-size:17px;font-weight:800;letter-spacing:-0.2px}
  .tarjeta{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow-sm);margin-bottom:12px;opacity:0;transform:translateY(10px);animation:tileIn 380ms var(--ease-out) forwards;animation-delay:calc(var(--i,0) * 60ms)}
  .hola{font-size:26px;font-weight:800;letter-spacing:-0.5px;line-height:1.15;margin:0 0 4px}
  .num{font-size:15px;color:var(--ink-soft);margin:0}
  .estado-grande{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px;border-radius:16px;background:var(--accent-soft);color:var(--accent)}
  .estado-grande .ico{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .estado-grande b{display:block;font-size:17.5px;font-weight:800}
  .estado-grande span{font-size:13.5px;color:var(--ink-soft)}
  .estado-grande.rojo{background:#FDECEA;color:var(--danger)}
  .estado-grande.rojo .ico{background:var(--danger)}
  .t-tit{font-size:13px;font-weight:800;color:var(--ink-soft);margin:0 0 14px}
  .avance{display:flex;flex-direction:column}
  .l-paso{display:flex;gap:14px;position:relative;padding-bottom:18px}
  .l-paso:last-child{padding-bottom:0}
  .l-paso:not(:last-child)::after{content:'';position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
  .l-paso.hecho:not(:last-child)::after{background:var(--accent)}
  .l-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;position:relative;z-index:1}
  .l-paso.hecho .l-dot{background:var(--accent);border-color:var(--accent)}
  .l-paso.actual .l-dot{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
  .l-paso.actual .l-dot::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--accent)}
  /* El paso actual pulsa suavemente */
  .l-paso.actual .l-dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:pulso 1.8s var(--ease-out) infinite}
  @keyframes pulso{0%{transform:scale(0.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
  .estado-grande .ico{position:relative}
  .estado-grande.vivo .ico::after{content:'';position:absolute;inset:-3px;border-radius:16px;border:2px solid var(--accent);opacity:0;animation:pulso 1.8s var(--ease-out) infinite}
  @media (prefers-reduced-motion: reduce){.l-paso.actual .l-dot::after,.estado-grande.vivo .ico::after{animation:none}}
  /* Avance de cada producto */
  .prod-av{display:flex;align-items:center;gap:8px;margin-top:8px}
  .prod-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;flex:1;max-width:120px}
  .prod-seg i{height:5px;border-radius:3px;background:var(--line)}
  .prod-seg i.on{background:var(--accent)}
  .prod-seg i.ahora{background:var(--accent);animation:parpadeo 1.6s ease-in-out infinite}
  @keyframes parpadeo{50%{opacity:.4}}
  @media (prefers-reduced-motion: reduce){.prod-seg i.ahora{animation:none}}
  .prod-est{font-size:12.5px;font-weight:800;color:var(--accent)}
  .l-t{font-size:15.5px;font-weight:800;padding-top:3px}
  .l-paso:not(.hecho):not(.actual) .l-t{color:var(--ink-faint)}
  .l-s{font-size:13px;color:var(--ink-soft);margin-top:1px}
  .fila{display:flex;justify-content:space-between;font-size:15px;padding:4px 0;color:var(--ink-soft)}
  .fila b{color:var(--ink)}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
  .total span{font-weight:800}
  .total b{font-size:26px;font-weight:800;color:var(--accent);letter-spacing:-0.5px}
  .prod{display:flex;gap:12px;padding:10px 0}
  .prod + .prod{border-top:1px solid var(--line)}
  .prod-foto{width:60px;height:60px;border-radius:12px;background:var(--surface-2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
  .prod-foto img{width:100%;height:100%;object-fit:cover}
  .prod-t{font-size:15px;font-weight:800}
  .prod-d{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
  .prod-p{font-size:13.5px;color:var(--ink-soft);margin-top:4px}
  .acciones{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .btn-wa{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:14px;background:#1FA855;color:#fff;font-size:16px;font-weight:800;text-decoration:none;transition:transform 140ms var(--ease-out)}
  .btn-wa:active{transform:scale(0.98)}
  .aviso-50{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:#8A5A00;background:#FFF4DC;padding:10px 12px;border-radius:12px;line-height:1.4}
  .pie{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:18px;line-height:1.5}
  .sk{background:var(--line);border-radius:12px;animation:pulse 1.2s ease-in-out infinite}
  .aviso-fin{text-align:center;padding:40px 20px}
  .aviso-fin h1{font-size:22px;font-weight:800;margin:14px 0 6px}
  .aviso-fin p{color:var(--ink-soft);margin:0 0 20px;line-height:1.5}
</style>
</head>
<body>
<main class="seg">
  <div class="seg-marca">
    <img src="assets/img/icon-192.png" alt="">
    <div><b>Herrería Artesanos</b><span class="eslogan" style="font-size:13.5px">Creando con distinción</span></div>
  </div>
  <div id="contenido">
    <div class="tarjeta" style="height:170px"><div class="sk" style="height:28px;width:60%"></div><div class="sk" style="height:16px;width:40%;margin-top:10px"></div><div class="sk" style="height:70px;margin-top:18px"></div></div>
    <div class="tarjeta" style="height:220px"><div class="sk" style="height:100%"></div></div>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/vendor/supabase.js?v=30"></script>
<script src="assets/js/supabase-client.js?v=30"></script>
<script src="assets/js/comun.js?v=30"></script>
<script src="assets/js/ventas-comun.js?v=30"></script>
<script>
(function(){
  'use strict';
  const db = window.db;
  const { esc, dinero, iconoTipo, toast } = window.AH;
  const AV = window.AV;
  const $ = (id) => document.getElementById(id);
  const NEGOCIO = '584220167079';
  const token = new URLSearchParams(location.search).get('t') || '';

  const ICON_OK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
  const ICON_WA = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>';
  const ICON_BAJAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
  const ICONOS = {
    doc:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
    ok:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
    herr:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 1 1-5.4 5.4L4 17v3h3l5.3-5.3"/></svg>',
    caja:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>',
    casa:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
    x:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };
  const waNegocio = (texto) => `https://wa.me/${NEGOCIO}?text=${encodeURIComponent(texto)}`;
  const fechaHora = (ts) => ts ? new Date(ts).toLocaleDateString('es-VE', { day:'numeric', month:'long' }) : '';

  function fin(titulo, texto){
    $('contenido').innerHTML = `<div class="tarjeta aviso-fin">
      <div class="vacio-ico" style="margin:0 auto">${ICONOS.doc}</div>
      <h1>${esc(titulo)}</h1><p>${esc(texto)}</p>
      <a class="btn-wa" href="${waNegocio('Hola, les escribo por mi pedido.')}" target="_blank" rel="noopener">${ICON_WA}Escribirnos por WhatsApp</a>
    </div>`;
  }

  let venta = null, pdfBlob = null;

  function pintar(v){
    const cot = AV.esCotizacion(v);
    const nombre = (v.cliente.nombre || '').split(' ')[0];
    const pag = AV.pagado(v.abonos), r = AV.resta(v);
    let i = 0;
    let estadoHtml;
    if(v.estado === 'cancelada') estadoHtml = `<div class="estado-grande rojo"><span class="ico">${ICONOS.x}</span><div><b>${cot ? 'Cotización descartada' : 'Pedido cancelado'}</b><span>${esc(fechaHora(v.cancelada_en))}</span></div></div>`;
    else if(cot) estadoHtml = `<div class="estado-grande"><span class="ico">${ICONOS.doc}</span><div><b>Cotización</b><span>Válida hasta el ${esc(AV.fechaLarga(v.vence_en))}</span></div></div>`;
    else {
      const info = { confirmada:[ICONOS.ok, 'Pedido confirmado', 'Ya recibimos tu abono'], en_produccion:[ICONOS.herr, 'En fabricación', 'Estamos trabajando en tu pedido'],
        lista:[ICONOS.caja, '¡Tu pedido está listo!', 'Escríbenos para coordinar la entrega'], entregada:[ICONOS.casa, 'Entregado', 'Gracias por confiar en nosotros'] }[v.estado];
      estadoHtml = `<div class="estado-grande ${v.estado !== 'entregada' ? 'vivo' : ''}"><span class="ico">${info[0]}</span><div><b>${info[1]}</b><span>${info[2]}</span></div></div>`;
    }
    let html = `<section class="tarjeta" style="--i:${i++}">
      <h1 class="hola">Hola, ${esc(nombre)}</h1>
      <p class="num">${cot ? 'Cotización' : 'Pedido'} N° ${v.id}</p>
      ${estadoHtml}
    </section>`;

    if(!cot && v.estado !== 'cancelada'){
      const inmediata = v.items.length && v.items.every(it => it.pieza_id);
      const pasos = [
        ['confirmada', 'Confirmado', v.confirmada_en],
        ['en_produccion', 'En fabricación', v.produccion_en],
        ['lista', 'Listo para entregar', v.lista_en],
        ['entregada', 'Entregado', v.entregada_en]
      ].filter(p => !(inmediata && p[0] === 'en_produccion'));
      const k = pasos.map(p => p[0]).indexOf(v.estado);
      html += `<section class="tarjeta" style="--i:${i++}"><p class="t-tit">Cómo va tu pedido</p><div class="avance">
        ${pasos.map((p, n) => {
          const hecho = n < k || (n === k && v.estado === 'entregada');
          const actual = n === k && v.estado !== 'entregada';
          let sub = p[2] ? fechaHora(p[2]) : '';
          if(p[0] === 'entregada' && !p[2] && v.fecha_entrega) sub = 'Fecha estimada: ' + AV.fechaLarga(v.fecha_entrega);
          return `<div class="l-paso ${hecho ? 'hecho' : ''} ${actual ? 'actual' : ''}"><span class="l-dot">${hecho ? ICON_OK : ''}</span>
            <div><div class="l-t">${p[1]}</div>${sub ? `<div class="l-s">${esc(sub)}</div>` : ''}</div></div>`;
        }).join('')}
      </div></section>`;
    }

    html += `<section class="tarjeta" style="--i:${i++}"><p class="t-tit">${cot ? 'Resumen' : 'Pagos'}</p>
      <div class="fila"><span>Productos</span><b>${dinero(v.subtotal)}</b></div>
      ${Number(v.descuento) ? `<div class="fila"><span>Descuento</span><b>- ${dinero(v.descuento)}</b></div>` : ''}
      ${Number(v.instalacion) ? `<div class="fila"><span>Instalación o traslado</span><b>${dinero(v.instalacion)}</b></div>` : ''}
      <div class="total"><span>Total</span><b>${dinero(v.total)}</b></div>
      ${cot ? '' : `
        <div class="barra" style="margin-top:14px"><i style="transform:scaleX(${Number(v.total) ? Math.max(0, Math.min(1, pag / v.total)) : 0})"></i></div>
        <div class="barra-txt"><span>Pagado <b>${dinero(pag)}</b></span><span>${r > 0 ? 'Resta <b>' + dinero(r) + '</b>' : '<b>Pagado completo</b>'}</span></div>
        ${v.abonos.length ? `<div style="margin-top:12px">${v.abonos.map(a => `<div class="fila" style="font-size:14px"><span>${a.tipo === 'devolucion' ? 'Devolución' : 'Abono'} · ${esc(AV.fechaNum(a.fecha))} · ${esc(a.metodo)}${a.estado === 'por_confirmar' ? ' <span class="plazo pronto" style="font-size:11px">En revisión</span>' : ''}</span><b>${a.tipo === 'devolucion' ? '- ' : ''}${dinero(a.monto)}</b></div>`).join('')}</div>` : ''}
        ${AV.porConfirmar(v.abonos).length ? `<div class="aviso-50" style="margin-top:10px">Estamos revisando tu pago. Cuando lo confirmemos se actualiza aquí; vuelve a revisar más tarde.</div>` : ''}`}
      <p class="num" style="font-size:12.5px;margin-top:10px">Montos en dólares (USD).</p>
    </section>`;

    // Avance de cada producto (por ahora todos avanzan con el pedido; con el módulo de Producción irá por producto)
    const inm = v.items.length && v.items.every(it => it.pieza_id);
    const EST = inm ? ['confirmada', 'lista', 'entregada'] : ['confirmada', 'en_produccion', 'lista', 'entregada'];
    const kp = EST.indexOf(v.estado);
    const NOM = inm ? ['Confirmado', 'Listo', 'Entregado'] : ['Confirmado', 'En fabricación', 'Listo', 'Entregado'];
    const avance = (!cot && kp >= 0) ? `<div class="prod-av"><span class="prod-seg" style="grid-template-columns:repeat(${EST.length},1fr)">${EST.map((_, n) => `<i class="${n < kp || (n === kp && v.estado === 'entregada') ? 'on' : n === kp ? 'ahora' : ''}"></i>`).join('')}</span><span class="prod-est">${NOM[kp]}</span></div>` : '';
    html += `<section class="tarjeta" style="--i:${i++}"><p class="t-tit">${v.items.length > 1 ? 'Tus productos (' + v.items.length + ')' : 'Tu producto'}</p>
      ${v.items.map(it => `<div class="prod">
        <div class="prod-foto">${it.foto ? `<img src="${esc(it.foto)}" alt="" loading="lazy">` : iconoTipo(it.tipo, 26)}</div>
        <div style="flex:1;min-width:0"><div class="prod-t">${esc(it.nombre)}</div>
          <div class="prod-d">${esc(AV.detalleItem(it))}</div>
          <div class="prod-p">${it.cantidad} × ${dinero(it.precio_unitario)}</div>${avance}</div>
      </div>`).join('')}
    </section>`;

    const textoWA = cot && v.estado === 'cotizacion' ? `Hola, quiero confirmar mi cotización N° ${v.id}.` : `Hola, les escribo por mi ${cot ? 'cotización' : 'pedido'} N° ${v.id}.`;
    html += `<section class="acciones">
      <button class="btn-primary" type="button" id="btnBajar" disabled><span class="spinner"></span>Preparando tu PDF</button>
      <a class="btn-wa" href="${waNegocio(textoWA)}" target="_blank" rel="noopener">${ICON_WA}${cot && v.estado === 'cotizacion' ? 'Confirmar por WhatsApp' : 'Escribirnos por WhatsApp'}</a>
    </section>
    <p class="pie">${v.estado === 'entregada' ? 'Este enlace estará disponible 3 días después de la entrega. Descarga tu nota final.' : 'Esta página se actualiza sola con cada avance y cada pago.'}<br>Herrería Artesanos · Maracaibo</p>`;
    $('contenido').innerHTML = html;
    $('btnBajar').addEventListener('click', () => {
      if(!pdfBlob) return;
      AV.descargarPDF(pdfBlob, venta);
    });
  }

  async function prepararPDF(){
    try{
      pdfBlob = await AV.crearPDF(venta);
      const b = $('btnBajar');
      if(b){ b.disabled = false; b.innerHTML = `${ICON_BAJAR}Descargar mi ${AV.esCotizacion(venta) ? 'cotización' : 'pedido'} (PDF)`; }
    } catch(e){
      const b = $('btnBajar'); if(b) b.textContent = 'No se pudo preparar el PDF';
    }
  }

  async function cargar(){
    if(!/^[0-9a-f-]{36}$/i.test(token)){ fin('Enlace no válido', 'Revisa que el enlace esté completo o escríbenos.'); return; }
    try{
      const { data, error } = await db.rpc('seguimiento_publico', { t: token });
      if(error) throw error;
      if(!data || data.error === 'no_existe'){ fin('No encontramos tu pedido', 'Revisa que el enlace esté completo o escríbenos.'); return; }
      if(data.error === 'vencido'){ fin('Este enlace ya venció', 'Estuvo disponible hasta 3 días después de la entrega. Si necesitas tu nota, escríbenos.'); return; }
      const cambio = !venta || venta.actualizado_en !== data.actualizado_en || (venta.abonos || []).length !== data.abonos.length || venta.estado !== data.estado;
      venta = data;
      if(cambio){ pintar(venta); pdfBlob = null; prepararPDF(); }
    } catch(e){
      if(!venta) fin('Sin conexión', 'Revisa tu internet y vuelve a abrir el enlace.');
    }
  }
  cargar();
  // Al volver a la página se revisa si hay novedades
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') cargar(); });
})();
</script>
</body>
</html>
